<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Phone Live Preview</title>
  <link rel="stylesheet" href="sidepanel.css">
  <script src="sidepanel.js" defer></script>
</head>
<body>
  <header><div class="logo">M</div><div><h1>My Phone</h1><p>Live Preview Bridge</p></div><span class="live">DEMO</span></header>
  <form id="connectForm">
    <label for="previewUrl">URL e aplikacionit në Vercel</label>
    <input type="url" id="previewUrl" placeholder="https://my-demo.vercel.app" spellcheck="false" required>
    <button type="submit" id="connectButton">Lidh demonstrimin</button>
  </form>
  <div class="toolbar"><span id="status" role="status" aria-live="polite">Vendos URL e demos për të filluar.</span><button type="button" id="reloadButton" title="Rifresko" disabled>↻</button></div>
  <div class="preview-wrap"><div id="placeholder"><span>▣</span><strong>Demonstrimi do të shfaqet këtu</strong><small>Së pari publiko web demo në Vercel dhe lidhe URL-në këtu.</small></div><iframe id="previewFrame" title="My Phone demo" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms" hidden></iframe></div>
  <footer><span id="revision">Versioni: —</span><span>Kontroll çdo ~15 sek.</span></footer>
</body>
</html>
