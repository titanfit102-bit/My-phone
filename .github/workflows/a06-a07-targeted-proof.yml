name: A06-A07 targeted regression proof (non-release)

on:
  push:
    branches: ["feat/a06-a07-targeted-ci-proof"]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install isolated dependencies
        run: npm ci --no-audit --no-fund
      - name: Node unit and repository checks
        run: npm run check:config
      - name: TypeScript
        run: npm run typecheck
      - name: Expo Web export
        run: npm run export:web
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser regressions
        run: npm run test:e2e
      - name: Upload test failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a06-a07-playwright-debug
          path: |
            studio/test-results/
            studio/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
