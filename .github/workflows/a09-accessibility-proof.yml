name: A09 accessibility functional verification (non-release)

on:
  push:
    branches: ["feat/a09-accessibility-functional-proof"]

permissions:
  contents: read

jobs:
  accessibility-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Restore project dependencies from unchanged lock
        run: npm ci --no-audit --no-fund
      - name: Node config and unit tests
        run: npm run check:config
      - name: TypeScript
        run: npm run typecheck
      - name: Generate Expo Web dist
        run: npm run export:web
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Focused A09 accessible names and keyboard controls
        run: npx playwright test e2e/a09-accessibility.spec.mjs
      - name: Full desktop and mobile Chromium regression
        run: npm run test:e2e
      - name: Retain non-secret debug evidence only if failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a09-accessibility-debug
          path: |
            studio/test-results/
            studio/playwright-report/
          retention-days: 5
          if-no-files-found: ignore
