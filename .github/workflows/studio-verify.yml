name: Verify Expo Studio

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "studio/**"
      - "docs/**"
      - "templates/**"
      - "README.md"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "studio/**"
      - "docs/**"
      - "templates/**"
      - "README.md"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, upstream verified 2026-10-21
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install isolated Expo dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify dependency graph
        run: npm ls --depth=0
      - name: Gate new or critical advisories (reviewed upstream exceptions only)
        run: node scripts/verify-security-audit.mjs
      - name: Verify Studio and repository isolation
        run: npm run check:config
      - name: Check TypeScript
        run: npm run typecheck
      - name: Export Expo Web
        run: npm run export:web
      - name: Verify packaged third-party notices
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const s=readFileSync('dist/THIRD_PARTY_NOTICES.txt','utf8'); for(const text of ['Package: react@','Package: react-dom@','Permission is hereby granted, free of charge']) if(!s.includes(text)) throw Error('Missing required notice: '+text);"
      - name: Verify static output
        run: node -e "const f=require('node:fs');if(!f.existsSync('dist/index.html'))process.exit(1)"
      - name: Verify deployment manifest
        run: node -e "const x=require('./dist/build-info.json');if(typeof x.revision!=='string'||!Number.isFinite(Date.parse(x.builtAt)))process.exit(1)"
      - name: Install Playwright Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise Studio in desktop and mobile Chromium
        run: npm run test:e2e
      - name: Upload Playwright traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: my-phone-studio-playwright-failures
          path: |
            studio/test-results/
            studio/playwright-report/
            studio/dist/THIRD_PARTY_NOTICES.txt
            studio/tests/FONT_FIXTURE_LICENSE.txt
            studio/node_modules/playwright/LICENSE
            studio/node_modules/playwright/NOTICE
            studio/node_modules/playwright/ThirdPartyNotices.txt
            studio/node_modules/playwright-core/LICENSE
            studio/node_modules/playwright-core/NOTICE
            studio/node_modules/playwright-core/ThirdPartyNotices.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Archive Expo Web export for visual smoke tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: my-phone-expo-web-dist
          path: studio/dist/
          if-no-files-found: error
          retention-days: 7
