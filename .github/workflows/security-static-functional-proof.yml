name: Security static controls plus full functional regression (non-release)

on:
  push:
    branches: ["feat/security-static-functional-regression-proof"]

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install from immutable lockfile
        run: npm ci --no-audit --no-fund
      - name: Scan tracked secrets and adversarial ZIP sandbox invariants
        run: npm run check:security-static
      - name: Node unit tests
        run: npm run check:config
      - name: TypeScript
        run: npm run typecheck
      - name: Expo Web export
        run: npm run export:web
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Desktop and mobile browser regression
        run: npm run test:e2e
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-static-functional-failure
          path: |
            studio/test-results/
            studio/playwright-report/
          retention-days: 5
          if-no-files-found: ignore
