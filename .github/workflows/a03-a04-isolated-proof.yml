name: A03/A04 isolated adversarial verification (non-release)

on:
  push:
    branches: ["feat/a03-a04-isolated-functional-proof"]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install project from pinned lock
        run: npm ci --no-audit --no-fund
      - name: Node checks including A04 injected negative control
        run: npm run check:config
      - name: TypeScript
        run: npm run typecheck
      - name: Expo Web export
        run: npm run export:web
      - name: Install Chromium without OS package changes
        run: npx playwright install chromium
      - name: A03 hostile ZIP navigation and worker/frame containment proof
        run: npx playwright test e2e/a03-navigation-boundary.spec.mjs
      - name: Complete browser regression desktop/mobile
        run: npm run test:e2e
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a03-a04-failed-proof
          path: |
            studio/test-results/
            studio/playwright-report/
          retention-days: 5
          if-no-files-found: ignore
